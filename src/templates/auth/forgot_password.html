{% extends 'auth/base.html' %}
{% block content %}
<main class="wrapper">
  <div class="main-content">
    <div class="main-content__card">
      <div class="card__wrapper">
        <div class="card__item">
          <div class="card__header">
            <div class="text-xl text-pretty font-semibold text-highlighted text-center">Quên mật khẩu</div>
            <div class="mt-1 text-base text-gray-700 text-center">
              Nhập email để nhận link đổi mật khẩu.
            </div>
          </div>
          <div class="card__content">
            {% if messages %}
              {% for message in messages %}
              <div id="alert-message-{{ forloop.counter }}" class="mb-4 text-center text-sm px-3 py-2 rounded transition-opacity duration-500
                  {% if message.tags == 'success' %} bg-green-100 text-green-700 
                  {% elif message.tags == 'error' %} bg-red-100 text-red-700 
                  {% else %} bg-gray-100 text-gray-700 {% endif %}">
                {{ message }}
              </div>
              {% endfor %}
            {% endif %}
            <form method="POST" action="/forgot-password">
              {% csrf_token %}
              <div class="text-sm mb-3">
                <label for="email" class="auth-form__label">Email</label>
                <div class="mt-1">
                  <input type="email" id="email" name="email" placeholder="Nhập email của bạn" class="auth-form__input"
                    required />
                </div>
              </div>

              <button type="submit" class="auth-form__btn__login">
                <span>Gửi liên kết</span>
              </button>

              <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-blue-600 hover:text-blue-800 text-sm font-medium">
                  Quay lại đăng nhập
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(() => {
      document.querySelectorAll('[id^="alert-message-"]').forEach(el => {
        el.style.opacity = '0';
        setTimeout(() => el.style.display = 'none', 500); 
      });
    }, 3000);
  });
</script>
{% endblock %}
