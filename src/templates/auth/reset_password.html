{% extends 'auth/base.html' %}
{% block content %}
<main class="wrapper">
  <div class="main-content">
    <div class="main-content__card">
      <div class="card__wrapper">
        <div class="card__item">
          <div class="card__header">
            <div class="text-xl text-pretty font-semibold text-highlighted text-center">
              Đổi mật khẩu
            </div>
            <div class="mt-1 text-base text-gray-700 text-center">
              Nhập mật khẩu mới của bạn bên dưới.
            </div>
          </div>

          <div class="card__content">
            <form method="POST" action="" onsubmit="resetPassword(event)">
              {% csrf_token %}
              <input type="hidden" id="resetUrl" value="{% url 'reset_password' uidb64=uid token=token %}" />
              <div class="text-sm mb-3">
                <label for="password" class="auth-form__label">Mật khẩu mới</label>
                <div class="mt-1">
                  <input type="password" id="password" name="password" placeholder="Nhập mật khẩu mới"
                    class="auth-form__input" required />
                </div>
                <p id="error-password" class="text-red-500 text-xs mt-1 hidden"></p>
              </div>

              <div class="text-sm mb-3">
                <label for="password2" class="auth-form__label">Nhập lại mật khẩu</label>
                <div class="mt-1">
                  <input type="password" id="password-comfirm" name="password-comfirm" placeholder="Nhập lại mật khẩu"
                    class="auth-form__input" required />
                </div>
                 <p id="error-password-comfirm" class="text-red-500 text-xs mt-1 hidden"></p>
              </div>

              <button type="submit" class="auth-form__btn__login">
                <span>Đổi mật khẩu</span>
              </button>

              <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-blue-600 hover:text-blue-800 text-sm font-medium">
                  Quay lại đăng nhập
                </a>
              </div>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</main>
{% load static %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
