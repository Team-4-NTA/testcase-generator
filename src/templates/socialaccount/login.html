{% extends "base.html" %}
{% load i18n %}
{% load socialaccount %}

{% block content %}
<div class="min-h-screen bg-gray-100 flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md text-center">
    <h1 class="text-2xl font-semibold text-gray-800 mb-4">
      Đăng nhập bằng Google
    </h1>
    <p class="text-gray-500 mb-6">
      Bạn sắp đăng nhập vào hệ thống bằng tài khoản Google của mình.
    </p>

    <div class="flex justify-center mb-6">
      <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google Logo"
        class="w-12 h-12"
      />
    </div>

    <form method="post" action="{% provider_login_url provider.id process=process %}">
      {% csrf_token %}
      <button
        type="submit"
        class="w-full flex items-center justify-center gap-3 py-3 bg-[#4285F4] text-white font-medium rounded-lg hover:bg-[#3367D6] transition duration-200"
      >
        <svg class="w-5 h-5" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.94 0 6.62 1.7 8.14 3.13l5.93-5.93C34.32 3.15 29.58 1 24 1 14.64 1 6.53 6.74 3.21 14.95l6.9 5.36C11.71 14.42 17.36 9.5 24 9.5z"/>
          <path fill="#34A853" d="M46.13 24.49c0-1.6-.14-3.12-.41-4.49H24v8.51h12.38c-.53 2.74-2.13 5.06-4.53 6.64l7.08 5.5c4.14-3.82 6.2-9.47 6.2-16.16z"/>
          <path fill="#FBBC05" d="M10.11 28.3a14.46 14.46 0 0 1-.76-4.3c0-1.5.26-2.95.76-4.3l-6.9-5.36A23.78 23.78 0 0 0 0 24c0 3.84.92 7.48 2.55 10.65l7.56-6.35z"/>
          <path fill="#4285F4" d="M24 47c6.48 0 11.92-2.13 15.9-5.85l-7.08-5.5c-1.97 1.34-4.5 2.1-8.82 2.1-6.64 0-12.29-4.92-13.89-11.52l-7.56 6.35C6.53 41.26 14.64 47 24 47z"/>
        </svg>
        <span>Đăng nhập bằng Google</span>
      </button>
    </form>

    <p class="text-sm text-gray-500 mt-6">
      Khi tiếp tục, bạn đồng ý với <a href="#" class="text-blue-600 underline">chính sách bảo mật</a>
      và <a href="#" class="text-blue-600 underline">điều khoản sử dụng</a> của chúng tôi.
    </p>
  </div>
</div>
{% endblock %}
